        channel_settings_help: "Une fois activé, les PDF de facture de ce canal sont des PDF/A-3 Factur-X (EN 16931) contenant un fichier factur-x.xml. L'adresse du vendeur provient des données de facturation de la boutique du canal. Vérifiez les mentions légales avec votre expert-comptable : ce plugin ne constitue pas un conseil juridique ou fiscal."
        customer_identifiers_help: "Identifiants facultatifs d'un client professionnel, repris dans les factures Factur-X (acheteur). La société de l'adresse de facturation est prioritaire."
