        electronic_address_scheme: "Schéma de l'adresse électronique"
        electronic_address_scheme_help: "Code de la liste EAS, par exemple 0225 pour l'annuaire français de la facturation électronique, 0002 pour un SIREN, 9930 pour un numéro de TVA allemand."
        channel:
            enabled: "Générer des factures Factur-X"
