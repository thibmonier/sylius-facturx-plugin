            siret: "SIRET"
            vat_number_help: "Par défaut, l'identifiant fiscal des données de facturation de la boutique."
            legal_form: "Forme juridique et capital social"
            legal_form_help: "par exemple « SAS au capital de 10 000 € »"
            trade_register: "Registre du commerce (RCS / RM)"
            trade_register_help: "par exemple « RCS Paris 123 456 789 »"
            operation_category: "Catégorie de l'opération"
            operation_category_help: "Mention obligatoire en France, portée par le cadre de facturation (BT-23) : B1/S1/M1, ou B2/S2/M2 si la facture est déjà payée."
            vat_on_debits: "TVA acquittée d'après les débits"
            vat_on_debits_help: "Option française : portée par le code de date d'exigibilité 5 (BT-8) dans chaque ventilation de TVA."
            zero_vat_category: "Catégorie de TVA des lignes sans TVA"
            zero_vat_category_help: "Utilisée pour les lignes et les frais de port sans taux de taxe ou avec un taux de 0 %."
            vat_exemption_reason: "Motif d'exonération de TVA"
            vat_exemption_reason_help: "BT-120, par exemple « TVA non applicable, art. 293 B du CGI »."
            vat_exemption_reason_code: "Code du motif d'exonération"
            vat_exemption_reason_code_help: "BT-121, liste VATEX, par exemple VATEX-FR-FRANCHISE ou VATEX-EU-IC."
            payment_terms: "Conditions de paiement"
            payment_due_days: "Échéance de paiement (jours)"
            payment_due_days_help: "Date d'échéance (BT-9) des factures non payées, comptée à partir de la date d'émission."
            iban: "IBAN"
            bic: "BIC"
            late_payment_penalties_note: "Pénalités de retard"
            late_payment_penalties_note_help: "Note avec le code sujet PMD."
            recovery_indemnity_note: "Indemnité forfaitaire pour frais de recouvrement"
            recovery_indemnity_note_help: "Note avec le code sujet PMT (40 € en France)."
            early_payment_discount_note: "Escompte pour paiement anticipé"
            early_payment_discount_note_help: "Note avec le code sujet AAB, par exemple « Pas d'escompte pour paiement anticipé »."
        customer:
            company_name: "Raison sociale"
            company_name_help: "Utilisée lorsque l'adresse de facturation n'a pas de société."
