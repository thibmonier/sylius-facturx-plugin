tmonier_facturx:
    ui:
        factur_x: "Factur-X"
        factur_x_settings: "Factur-X settings"
        download_xml: "Factur-X XML"
        b2b_identifiers: "B2B identifiers"
        no_b2b_identifiers: "No B2B identifiers: the invoices use the billing address only."
        channel_settings_help: "When enabled, the invoice PDFs of this channel are Factur-X (EN 16931) PDF/A-3 files with an embedded factur-x.xml. The address of the seller comes from the shop billing data of the channel. Check the legal mentions with your accountant: this plugin is not legal or tax advice."
        customer_identifiers_help: "Optional identifiers of a business customer, written in the Factur-X invoices (buyer). The company name of the billing address takes precedence."
        section:
            seller: "Seller"
            vat: "VAT and category of operation"
            payment: "Payment"
            notes: "Payment notes"
    form:
        siren: "SIREN"
        vat_number: "VAT number"
        electronic_address: "Electronic invoicing address"
        electronic_address_help: "Routing address of the e-invoicing platform (BT-34 / BT-49), e.g. the SIREN in France."
        electronic_address_scheme: "Electronic address scheme"
        electronic_address_scheme_help: "Code of the EAS list, e.g. 0225 for the French e-invoicing directory, 0002 for a SIREN, 9930 for a German VAT number."
        channel:
            enabled: "Generate Factur-X invoices"
            enabled_help: "Applies to the invoice PDFs generated from now on; the PDFs already stored are not changed."
            legal_name: "Legal name"
            legal_name_help: "Defaults to the company of the shop billing data."
            siren_help: "Legal registration identifier (BT-30), mandatory in France."
            siret: "SIRET"
            vat_number_help: "Defaults to the tax ID of the shop billing data."
            legal_form: "Legal form and share capital"
            legal_form_help: "e.g. \"SAS with a share capital of 10,000 EUR\""
            trade_register: "Trade register"
            trade_register_help: "e.g. \"RCS Paris 123 456 789\""
            operation_category: "Category of operation"
            operation_category_help: "French mandatory mention, written in the business process (BT-23): B1/S1/M1, or B2/S2/M2 when the invoice is already paid."
            vat_on_debits: "VAT on debits"
            vat_on_debits_help: "French option: written as the VAT point date code 5 (BT-8) in every VAT breakdown."
            zero_vat_category: "VAT category of the lines without VAT"
            zero_vat_category_help: "Used for the lines and shipping without tax rate or with a 0% rate."
            vat_exemption_reason: "VAT exemption reason"
            vat_exemption_reason_help: "BT-120, e.g. \"TVA non applicable, art. 293 B du CGI\"."
            vat_exemption_reason_code: "VAT exemption reason code"
            vat_exemption_reason_code_help: "BT-121, VATEX list, e.g. VATEX-FR-FRANCHISE or VATEX-EU-IC."
            payment_terms: "Payment terms"
            payment_due_days: "Payment due in (days)"
            payment_due_days_help: "Due date (BT-9) of the unpaid invoices, counted from the issue date."
            iban: "IBAN"
            bic: "BIC"
            late_payment_penalties_note: "Late payment penalties"
            late_payment_penalties_note_help: "Note with the subject code PMD."
            recovery_indemnity_note: "Fixed recovery indemnity"
            recovery_indemnity_note_help: "Note with the subject code PMT (40 EUR in France)."
            early_payment_discount_note: "Early payment discount"
            early_payment_discount_note_help: "Note with the subject code AAB, e.g. \"No discount for early payment\"."
        customer:
            company_name: "Company name"
            company_name_help: "Used when the billing address has no company."
    operation_category:
        goods: "Supply of goods (B)"
        services: "Supply of services (S)"
        mixed: "Goods and services (M)"
    vat_category:
        E: "E - Exempt from VAT"
        Z: "Z - Zero rated"
        O: "O - Not subject to VAT"
        AE: "AE - Reverse charge"
        K: "K - Intra-community supply"
        G: "G - Export outside the EU"
