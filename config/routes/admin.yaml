tmonier_facturx_admin_channel_settings:
    path: /channels/{id}/factur-x
    methods: [GET, POST]
    requirements:
        id: '\d+'
    defaults:
        _controller: tmonier_facturx.controller.admin::channelSettingsAction

tmonier_facturx_admin_customer_identifiers:
    path: /customers/{id}/factur-x
    methods: [GET, POST]
    requirements:
        id: '\d+'
    defaults:
        _controller: tmonier_facturx.controller.admin::customerIdentifiersAction

tmonier_facturx_admin_invoice_download_xml:
    path: /invoices/{id}/factur-x.xml
    methods: [GET]
    requirements:
        # Any identifier without a slash: UUIDs by default, but the invoice identifier
        # generator (sylius_invoicing.generator.invoice_identifier) can be replaced.
        id: '[^/]+'
    defaults:
        _controller: tmonier_facturx.controller.admin::downloadXmlAction
