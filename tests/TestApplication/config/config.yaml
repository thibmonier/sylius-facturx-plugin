imports:
    - { resource: "@SyliusInvoicingPlugin/config/config.yaml" }
    - { resource: "@TmonierSyliusFacturXPlugin/config/config.yaml" }
    - { resource: "fake_invoice_pdf.php" }
    - { resource: "payment_terms.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

knp_snappy:
    pdf:
        enabled: true
        binary: '%env(resolve:WKHTMLTOPDF_PATH)%'
        options: []

# Remove if you do not need to extend entities
doctrine:
    orm:
        entity_managers:
            default:
                mappings:
                    TestApplication:
                        is_bundle: false
                        type: attribute
                        dir: '%kernel.project_dir%/../../../tests/TestApplication/src/Entity'
                        prefix: Tests\Tmonier\SyliusFacturXPlugin

# The test invoices have the same numbers as the dev ones: keep their PDFs apart.
when@test:
    parameters:
        sylius_invoicing.invoice_save_path: "%kernel.project_dir%/private/invoices_test/"
