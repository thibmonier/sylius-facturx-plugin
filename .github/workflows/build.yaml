name: Build

on:
    push:
        branches-ignore:
            - 'dependabot/**'
        paths-ignore:
            - "*.md"
    pull_request:
        paths-ignore:
            - "*.md"
    release:
        types: [created]
    schedule:
        -
            cron: "0 1 * * 6" # Run at 1am every Saturday
    workflow_dispatch: ~

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# No default token permission: every job asks for what it needs (US-209).
permissions: {}

jobs:
    tests:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            checks: write

        name: "Sylius ${{ matrix.sylius }}, PHP ${{ matrix.php }}, Symfony ${{ matrix.symfony }}, ${{ matrix.database }}"

        strategy:
            fail-fast: false
            matrix:
                php: ["8.3", "8.4"]
                symfony: ["^7.4"]
                sylius: ["~2.2.0", "~2.3.0"]
                database: ["mysql:8.4"]
                node: ["22.x"]

                include:
                    - php: "8.2"
                      symfony: "^6.4"
                      sylius: "~2.2.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^8.0"
                      sylius: "~2.3.0"
                      database: "mysql:8.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.2.0"
                      database: "mariadb:11.4"
                      node: "22.x"
                    - php: "8.4"
                      symfony: "^7.4"
                      sylius: "~2.3.0"
                      database: "postgres:17"
                      node: "22.x"

        env:
            APP_ENV: test

        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@c3b108b5f3c299c55f429a8cf0ed88734d4f4979 # v4.3.1
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-${{ matrix.php }}-composer-"
                    database: "${{ matrix.database }}"
                    node_version: "${{ matrix.node }}"
                    php_version: "${{ matrix.php }}"
                    sylius_version: "${{ matrix.sylius }}"
                    symfony_version: "${{ matrix.symfony }}"

            -
                name: Audit of the PHP dependencies
                run: composer audit --abandoned=report

            -
                name: Run static analysis
                # Symfony 6.4 Config builder is not typed enough for PHPStan at level max
                if: matrix.symfony != '^6.4'
                run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

            -
                name: Check coding standard
                run: vendor/bin/ecs check

            -
                name: Run unit tests
                run: vendor/bin/phpunit --colors=always --testsuite=unit

            -
                name: Validate composer.json
                run: composer validate --ansi --strict

            -
                name: Validate container
                run: vendor/bin/console lint:container

            -
                name: Run Non-unit PHPUnit tests
                run: vendor/bin/phpunit --colors=always --testsuite=non-unit

            -
                name: Install PCOV for coverage
                if: matrix.php == '8.4' && matrix.sylius == '~2.3.0' && matrix.symfony == '^7.4' && matrix.database == 'mysql:8.4' && github.ref == 'refs/heads/main'
                uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
                with:
                    php-version: "8.4"
                    coverage: pcov

            # One matrix combination only, on main: the figure is published as a "coverage" check run (US-253).
            # `|| true`: the test steps above already gate the build, this step only measures.
            -
                name: PHPUnit line coverage
                if: matrix.php == '8.4' && matrix.sylius == '~2.3.0' && matrix.symfony == '^7.4' && matrix.database == 'mysql:8.4' && github.ref == 'refs/heads/main'
                id: coverage
                shell: bash
                run: |
                    mkdir -p build
                    vendor/bin/phpunit --colors=never --testsuite=all --coverage-filter=src --coverage-clover build/coverage.xml || true
                    if [ ! -f build/coverage.xml ]; then echo "No coverage report generated"; exit 0; fi
                    COVERED=$(php -r '$x=simplexml_load_file("build/coverage.xml");echo (int)$x->project->metrics["coveredstatements"];')
                    TOTAL=$(php -r '$x=simplexml_load_file("build/coverage.xml");echo (int)$x->project->metrics["statements"];')
                    if [ "$TOTAL" -gt 0 ]; then
                      RATE=$(php -r "printf('%.2f', 100*$COVERED/$TOTAL);")
                      echo "rate=${RATE}" >> "$GITHUB_OUTPUT"
                      echo "covered=${COVERED}" >> "$GITHUB_OUTPUT"
                      echo "total=${TOTAL}" >> "$GITHUB_OUTPUT"
                      {
                        echo "### PHPUnit line coverage"
                        echo "COVERAGE_LINES: ${RATE}"
                        echo "\`${COVERED}/${TOTAL}\` statements covered"
                      } >> "$GITHUB_STEP_SUMMARY"
                    fi

            -
                name: Publish coverage check run
                if: always() && steps.coverage.outputs.rate != ''
                uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
                env:
                    COV_RATE: ${{ steps.coverage.outputs.rate }}
                    COV_COVERED: ${{ steps.coverage.outputs.covered }}
                    COV_TOTAL: ${{ steps.coverage.outputs.total }}
                with:
                    script: |
                        await github.rest.checks.create({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          name: 'coverage',
                          head_sha: context.sha,
                          status: 'completed',
                          conclusion: 'success',
                          output: {
                            title: `Line coverage: ${process.env.COV_RATE}%`,
                            summary: `COVERAGE_LINES: ${process.env.COV_RATE}\n${process.env.COV_COVERED}/${process.env.COV_TOTAL} statements covered`
                          }
                        });

    facturx-validation:
        runs-on: ubuntu-latest
        permissions:
            contents: read

        # Renders a real invoice with wkhtmltopdf (patched Qt, in Docker), embeds the XML, and runs
        # the Mustang validator (EN 16931 schematron + veraPDF PDF/A-3) on the files written by
        # the functional tests. Not blocking until it has run green on GitHub.
        name: "Factur-X validation (Mustang, veraPDF)"
        continue-on-error: true

        env:
            APP_ENV: test
            MUSTANG_VERSION: "2.26.0"

        steps:
            -
                uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
                with:
                    persist-credentials: false

            -
                name: Pull wkhtmltopdf
                run: |
                    docker pull --platform linux/amd64 surnet/alpine-wkhtmltopdf:3.20.3-0.12.6-full
                    echo "WKHTMLTOPDF_PATH=$GITHUB_WORKSPACE/tests/TestApplication/bin/wkhtmltopdf-docker" >> "$GITHUB_ENV"

            -
                name: Build Sylius Test Application
                uses: SyliusLabs/BuildTestAppAction@c3b108b5f3c299c55f429a8cf0ed88734d4f4979 # v4.3.1
                with:
                    e2e_js: "yes"
                    cache_key: "${{ runner.os }}-php-8.4-composer-${{ hashFiles('**/composer.json') }}"
                    cache_restore_key: "${{ runner.os }}-php-8.4-composer-"
                    database: "mysql:8.4"
                    node_version: "22.x"
                    php_version: "8.4"
                    sylius_version: "~2.3.0"
                    symfony_version: "^7.4"

            -
                name: Generate Factur-X PDFs and XML
                run: |
                    vendor/bin/console cache:clear
                    vendor/bin/phpunit --colors=always --fail-on-skipped --filter 'testTheAdminDownloadServesAFacturXPdf|testTheAdminDownloadsTheXmlOfAnInvoice|RealInvoicePdfTest' tests/Functional
                    ls -l etc/build/

            -
                uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
                with:
                    distribution: temurin
                    java-version: "21"

            -
                name: Validate with Mustang
                run: |
                    curl -sSfL -o mustang.jar "https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/${MUSTANG_VERSION}/Mustang-CLI-${MUSTANG_VERSION}.jar"
                    status=0
                    for file in etc/build/factur-x.xml etc/build/factur-x.pdf etc/build/factur-x-wkhtmltopdf.pdf; do
                        java -jar mustang.jar --no-notices --action validate --source "$file" > "$file.report.xml" || true
                        cat "$file.report.xml"
                        # The exit code is not reliable: every summary of the report must be valid.
                        # Warnings (e.g. PEPPOL-EN16931-R008 for unshipped orders) are accepted.
                        if ! grep -q '<summary status="valid"' "$file.report.xml" || grep -q '<summary status="invalid"' "$file.report.xml"; then
                            status=1
                        fi
                    done
                    exit $status

            -
                name: Upload the generated files and reports
                if: always()
                uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
                with:
                    name: facturx-validation
                    path: etc/build/factur-x*

    # Static audit of the workflows themselves (US-209). Version and image are pinned, no network.
    zizmor:
        name: Workflow audit (zizmor)
        runs-on: ubuntu-latest
        permissions:
            contents: read
        timeout-minutes: 10
        env:
            ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor:1.31.1@sha256:42d409dbb851d4c5d35a058cf042b828bea1e3f2884378c526eb0974780e18d9
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: zizmor (offline)
              run: docker run --rm -v "$PWD:/work" -w /work "$ZIZMOR_IMAGE" --offline .github
